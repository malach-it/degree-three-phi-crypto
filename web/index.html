<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Phi identity workspace for private identifiers and controlled, cryptographically verified information exchange."
    />
    <title>Phi Identity Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="Phi Identity home">
          <span class="brand-mark">φ</span>
          <span><strong>Phi</strong><small>Identity console</small></span>
        </a>
        <nav id="primary-nav" aria-label="Primary navigation"></nav>
        <div class="network-card">
          <div><span class="pulse"></span><span id="network-label">Local workspace</span></div>
          <strong id="network-status">Checking chain…</strong>
          <small id="authority-short">Browser persistence active</small>
        </div>
        <button class="profile-chip" data-action="open-settings">
          <span class="avatar">PC</span>
          <span><strong>Private console</strong><small>Device workspace</small></span>
          <span>•••</span>
        </button>
      </aside>

      <main>
        <header class="topbar">
          <button class="icon-button menu-button" data-action="toggle-nav" aria-label="Toggle navigation">☰</button>
          <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="page-crumb">Overview</strong></div>
          <div class="top-actions">
            <button class="icon-button" data-action="copy-workspace" aria-label="Copy workspace summary">⧉</button>
            <button class="button primary compact" data-action="new-identity"><span>＋</span> New identity</button>
          </div>
        </header>
        <section id="app" class="page" aria-live="polite"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="assertive"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
